<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - TOPECH</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    text-align: center;
  }
  h1 {
    font-size: 72px;
    color: #0d3b66;
    margin-bottom: 10px;
  }
  h2 {
    font-size: 24px;
    color: #555;
    margin-bottom: 20px;
  }
  p {
    font-size: 16px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: #0d3b66;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.3s;
  }
  .btn:hover {
    background: #1a5490;
  }
  .redirect-notice {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #856404;
  }
</style>
</head>
<body>
<div class="container">
  <div class="redirect-notice" id="redirectNotice" style="display:none;">
    ⚡ Redirecting from old URL...
  </div>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for has moved or no longer exists. TOPECH has migrated to a new website with improved product information and resources.</p>
  <a href="/" class="btn">Go to Homepage</a>
</div>

<script>
  // Redirect ALL old URLs to products page
  (function() {
    const path = window.location.pathname;
    
    // Only redirect if it's not the homepage or a valid page
    if (path !== '/' && path !== '/index.html' && path !== '/products.html' && path !== '/contact.html') {
      const notice = document.getElementById('redirectNotice');
      notice.style.display = 'block';
      notice.textContent = '⚡ This page has moved. Redirecting to Products...';
      
      // Redirect to products page after 1.5 seconds
      setTimeout(function() {
        window.location.href = '/products.html';
      }, 1500);
    }
  })();
</script>
</body>
</html>
